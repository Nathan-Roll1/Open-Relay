name: Verify Fourier with Open Relay's pinned Swift runtime
on:
  push:
    branches: [qa/fourier-pinned-swift]
permissions:
  contents: read
jobs:
  speech:
    if: github.repository == 'Nathan-Roll1/Open-Relay'
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build exactly the MLX Audio version pinned by the app
        run: |
          xcodebuild -downloadComponent MetalToolchain
          git clone -q --filter=blob:none https://github.com/Blaizzy/mlx-audio-swift /tmp/pinned-mlx
          cd /tmp/pinned-mlx && git checkout -q 01dec7c9bdce3088a6b6b7ab9f2e403458195efb
          python3 - <<'PYHARNESS'
          from pathlib import Path
          p=Path("Sources/Tools/mlx-audio-swift-stt/App.swift");s=p.read_text()
          marker="return .stt(try await STT.loadModel(modelRepo: repo))"
          assert marker in s
          s=s.replace(marker,'if repo.hasPrefix("/") { return .stt(try await Qwen3ASRModel.fromModelDirectory(URL(fileURLWithPath: repo))) }\n        '+marker)
          method = Path(__import__("os").environ["GITHUB_WORKSPACE"], "qa-fourier-directory.swift.txt").read_text()
          marker = 'if repo.hasPrefix("/")'
          s = s.replace(marker, 'if repo == "oruk/oruk-fourier-2b" { let cache = HubCache(location: .fixed(directory: URL(fileURLWithPath: "/tmp/relay-public-cache"))); let dir = try await fourierModelDirectory(cache: cache); return .stt(try await Qwen3ASRModel.fromModelDirectory(dir)) }\n        '+marker, 1)
          s = "import HuggingFace\n"+s+"\n"+method
          p.write_text(s)
          pkg = Path('Package.swift')
          s = pkg.read_text().replace('dependencies: ["MLXAudioCore", "MLXAudioSTT"],', 'dependencies: ["MLXAudioCore", "MLXAudioSTT", .product(name: "HuggingFace", package: "swift-huggingface")],', 1)
          pkg.write_text(s)
          PYHARNESS
          xcodebuild -skipPackagePluginValidation -skipMacroValidation -scheme mlx-audio-swift-stt -configuration Debug -destination 'platform=macOS' -derivedDataPath /tmp/relay-derived build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > /tmp/relay-build.log 2>&1 || { tail -65 /tmp/relay-build.log; exit 1; }
      - name: Download from the public card, transcribe and repeat with an offline cache
        run: |
          set -eo pipefail
          curl -fsSL https://raw.githubusercontent.com/ggml-org/whisper.cpp/b0a11594aec50892a02cd8d129eee2dfe93a8bb8/samples/jfk.wav -o /tmp/jfk.wav
          curl -fsSL https://raw.githubusercontent.com/brittain9/speech-kit-obsidian-plugin/5d62e514bef084d65c9e0ea590636982b084aa43/native/tests/fixtures/audio/7021-79740-0000.wav -o /tmp/libri.wav
          for sample in jfk libri; do
            if [ "$sample" = libri ]; then export HF_HUB_OFFLINE=1; fi
            /tmp/relay-derived/Build/Products/Debug/mlx-audio-swift-stt --model oruk/oruk-fourier-2b --audio "/tmp/$sample.wav" --language English --format txt --output-path "/tmp/$sample-out"
            cat "/tmp/$sample-out.txt"
            echo
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          norm=lambda s:re.findall(r"[a-z']+",s.lower())
          ref='And so my fellow Americans ask not what your country can do for you ask what you can do for your country'
          assert norm(Path('/tmp/jfk-out.txt').read_text())==norm(ref)
          words=norm(Path('/tmp/libri-out.txt').read_text())
          assert words==norm('To such persons these indirect modes of training children in habits of subordination to their will or rather of yielding to their influence are specially useful')
          assert 'yielding to their influence' in ' '.join(words)
          print("Verified using Qwen3ASRModel.fromModelDirectory on the pinned Swift library")
          PY
