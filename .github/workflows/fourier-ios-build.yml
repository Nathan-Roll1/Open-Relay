name: Compile the full Open Relay Fourier app
on:
  push:
    branches: [qa/fourier-app-build]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'Nathan-Roll1/Open-Relay'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21f97e02b10596f581532c32ad0441d07b60e6e8
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Install Apple's Metal compiler
        run: xcodebuild -version && xcodebuild -downloadComponent MetalToolchain
      - name: Build all user-facing targets with the original application entry
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -help-hidden | grep -e solver-expression-time-threshold -e solver-memory-threshold
          xcodebuild -project 'Open UI.xcodeproj' -scheme 'Open UI' -configuration Debug \
            -destination 'generic/platform=iOS' -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation -skipMacroValidation -derivedDataPath /tmp/openrelay-build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            'OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -solver-expression-time-threshold=120 -Xfrontend -solver-memory-threshold -Xfrontend 2147483648' \
            build >/tmp/openrelay-full.log 2>&1 || { grep -m30 -E 'error:|fatal error|BUILD FAILED' /tmp/openrelay-full.log || tail -30 /tmp/openrelay-full.log; exit 1; }
          grep -F '** BUILD SUCCEEDED **' /tmp/openrelay-full.log
          app=$(find /tmp/openrelay-build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          test -f "$app/Info.plist"
          git diff --exit-code HEAD
