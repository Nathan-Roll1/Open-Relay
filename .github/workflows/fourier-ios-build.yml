name: Compile the full Open Relay Fourier app
on:
  push:
    branches: [qa/fourier-app-build]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'Nathan-Roll1/Open-Relay'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b72fcb9400c79c96d7237347a50cf0c90be46e9
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Type-check the watch orb against the watchOS SDK
        run: |
          swiftc -typecheck -target arm64_32-apple-watchos11.0 -sdk "$(xcrun --sdk watchos --show-sdk-path)" OpenRelayWatch/Views/OrbView.swift
      - name: Install Apple's Metal compiler
        run: xcodebuild -version && xcodebuild -downloadComponent MetalToolchain
      - name: Build all user-facing targets with the original application entry
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project 'Open UI.xcodeproj' -scheme 'Open UI' -configuration Debug \
            -destination 'generic/platform=iOS' -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation -skipMacroValidation -derivedDataPath /tmp/openrelay-build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build >/tmp/openrelay-full.log 2>&1 || { grep -m30 -E 'error:|fatal error|BUILD FAILED' /tmp/openrelay-full.log || tail -30 /tmp/openrelay-full.log; exit 1; }
          grep -F '** BUILD SUCCEEDED **' /tmp/openrelay-full.log
          app=$(find /tmp/openrelay-build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          for component in             "Info.plist"             "PlugIns/OpenUIWidgetsExtension.appex/Info.plist"             "PlugIns/OpenUIShareExtension.appex/Info.plist"             "Watch/OpenRelayWatch.app/Info.plist"             "Watch/OpenRelayWatch.app/PlugIns/OpenRelayWatchWidgets.appex/Info.plist"; do
            test -f "$app/$component"
            echo "Built $component"
          done
          if find "$app" -type f \( -iname '*.gguf' -o -iname '*.safetensors' -o -iname '*.onnx' -o -iname '*.mlmodel' -o -iname '*.mlpackage' -o -iname '*.tflite' -o -iname 'weight.bin' \) | grep -q .; then
            echo "Model weights present; skip packaging"
          else
            ditto -c -k --keepParent "$app" /tmp/open-relay-unsigned.zip
          fi
          git diff --exit-code HEAD
      - name: Save unsigned app and its extensions
        uses: actions/upload-artifact@v4
        with:
          name: Open-Relay-unsigned-iOS-full
          path: /tmp/open-relay-unsigned.zip
          if-no-files-found: warn
          retention-days: 7
