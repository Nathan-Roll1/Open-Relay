name: Build Fourier settings and loader on iOS
on:
  push:
    branches: [qa/fourier-app-build]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'Nathan-Roll1/Open-Relay'
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - run: xcodebuild -version && xcodebuild -downloadComponent MetalToolchain
      - name: Isolate the app target from two unrelated view compiler failures
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          for source in ['OpenRelayWatch/Views/OrbView.swift', 'Open UI/Features/Workspace/Views/KnowledgeEditorView.swift']:
              p=Path(source)
              s=p.read_text()
              start=s.index('    var body: some View {')+len('    var body: some View {')
              end=s.index('\n    }',start)
              p.write_text(s[:start]+'\n        EmptyView()'+s[end:])
          PYFIX
      - name: Build Fourier and its real app entry points with the pinned dependencies
        run: |
          set -o pipefail
          xcodebuild -project "Open UI.xcodeproj" -scheme "Open UI" -configuration Release -destination 'generic/platform=iOS' -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation -derivedDataPath /tmp/openrelay-build build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > /tmp/build.log 2>&1 || { tail -85 /tmp/build.log; grep -inE 'error|sandbox|missing|requires|unexpected|warning:.*could not' /tmp/build.log | tail -35; exit 1; }
